					<ul class="nav__list">
						<li>
							<a class="nav__link" href="#about" data-i18n="nav_about"></a>
						</li>
						<li>
							<a class="nav__link" href="#courses" data-i18n="nav_courses"></a>
						</li>
						<li>
							<a
								class="nav__link"
								href="#benefits"
								data-i18n="nav_benefits"
							></a>
						</li>
						<!-- <li>
							<a class="nav__link" href="#gallery" data-i18n="nav_gallery"></a>
						</li> -->
						<li>
							<a
								class="nav__link"
								href="#testimonials"
								data-i18n="nav_testimonials"
							></a>
						</li>
						<li>
							<a
								class="nav__link nav__link--cta"
								href="#contact"
								data-i18n="nav_contact"
							></a>
						</li>
					</ul>
				</nav>
				<div
					class="lang"
					role="group"
					aria-label=""
					data-i18n-attr="aria-label|lang_group_aria"
				>
					<button
						type="button"
						class="lang__btn"
						data-lang="ua"
						aria-pressed="true"
					>
						UA
					</button>
					<button
						type="button"
						class="lang__btn"
						data-lang="de"
						aria-pressed="false"
					>
						DE
					</button>
				</div>
				<button
					type="button"
					class="menu-toggle"
					aria-expanded="false"
					aria-controls="mobile-nav"
					aria-label=""
				>
					<span class="menu-toggle__bar" aria-hidden="true"></span>

				</button>
			</div>
			<div class="mobile-nav" id="mobile-nav" hidden>
				<nav
					class="mobile-nav__inner"
					aria-label=""
					data-i18n-attr="aria-label|nav_aria"
				>
					<a href="#about" data-i18n="nav_about"></a>
					<a href="#courses" data-i18n="nav_courses"></a>
					<a href="#benefits" data-i18n="nav_benefits"></a>

					<a href="#contact" data-i18n="nav_contact"></a>
				</nav>

		<main id="main">

						<p class="eyebrow reveal" data-reveal data-i18n="hero_eyebrow"></p>
						<h1

							data-reveal
							id="hero-title"
							data-i18n="hero_title"
						></h1>
						<p
							class="hero__subtitle reveal"
							data-reveal
							data-i18n="hero_subtitle"
						></p>
						<div class="hero__actions reveal" data-reveal>
							<a
								class="btn btn--primary"
								href="#contact"
								data-i18n="hero_cta"
							></a>
							<a
								class="btn btn--ghost"
								href="#courses"
								data-i18n="hero_cta_secondary"
							></a>
						</div>
					</div>
					<figure class="hero__portrait reveal" data-reveal>
						<!-- <div
              class="hero__portrait-frame"
              role="img"
              data-i18n-attr="aria-label|hero_portrait_alt"

							height="650"

					</figure>
				</div>
				<div class="hero__scroll" aria-hidden="true"></div>
			</section>

			<section class="section about" id="about" aria-labelledby="about-title">
				<div class="container about__grid">
					<div class="about__text reveal" data-reveal>
						<p class="section__kicker" data-i18n="about_kicker"></p>
						<h2
							class="section__title"
							id="about-title"
							data-i18n="about_title"
						></h2>
						<p class="section__lead" data-i18n="about_subtitle"></p>
						<p class="section__body" data-i18n="about_body"></p>
					</div>
				</div>
			</section>

			<section
				class="section courses"
				id="courses"
				aria-labelledby="courses-title"
			>
				<div class="container">
					<header class="section__head reveal" data-reveal>
						<p class="section__kicker" data-i18n="courses_kicker"></p>
						<div class="section__headrow">
							<h2
								class="section__title"
								id="courses-title"
								data-i18n="courses_title"
							></h2>
							<p class="section__intro" data-i18n="courses_intro"></p>
						</div>
					</header>
					<div class="grid-courses">
						<article class="card card--course reveal" data-reveal>
							<span class="card__index" aria-hidden="true">01</span>
							<h3 class="card__title" data-i18n="course_kids_title"></h3>
							<p class="card__text" data-i18n="course_kids_desc"></p>
						</article>
						<article class="card card--course reveal" data-reveal>
							<span class="card__index" aria-hidden="true">02</span>
							<h3 class="card__title" data-i18n="course_beginners_title"></h3>
							<p class="card__text" data-i18n="course_beginners_desc"></p>
						</article>
						<article class="card card--course reveal" data-reveal>
							<span class="card__index" aria-hidden="true">03</span>
							<h3
								class="card__title"
								data-i18n="course_intermediate_title"

							<p class="card__text" data-i18n="course_intermediate_desc"></p>
						</article>
						<article class="card card--course reveal" data-reveal>
							<span class="card__index" aria-hidden="true">04</span>
							<h3 class="card__title" data-i18n="course_private_title"></h3>
							<p class="card__text" data-i18n="course_private_desc"></p>
						</article>
					</div>
				</div>
			</section>

			<section
				class="section benefits"
				id="benefits"
				aria-labelledby="benefits-title"
			>
				<div class="container">
					<header
						class="section__head section__head--center reveal"
						data-reveal
					>
						<p class="section__kicker" data-i18n="benefits_kicker"></p>

							class="section__title"
							id="benefits-title"
							data-i18n="benefits_title"
						></h2>
						<p data-i18n="benefits_paragraph"></p>
					</header>
					<ul class="grid-benefits">
						<li class="benefit reveal" data-reveal>
							<span class="benefit__icon" aria-hidden="true"></span>
							<h3 class="benefit__title" data-i18n="benefit_balance_title"></h3>
							<p class="benefit__text" data-i18n="benefit_balance_text"></p>
						</li>
						<li class="benefit reveal" data-reveal>
							<span
								class="benefit__icon benefit__icon--b"
								aria-hidden="true"

								data-i18n="benefit_confidence_title"

							<p class="benefit__text" data-i18n="benefit_confidence_text"></p>
						</li>
						<li class="benefit reveal" data-reveal>
							<span
								class="benefit__icon benefit__icon--c"
								aria-hidden="true"
							></span>
							<h3
								class="benefit__title"
								data-i18n="benefit_creativity_title"
							></h3>
							<p class="benefit__text" data-i18n="benefit_creativity_text"></p>
						</li>
						<li class="benefit reveal" data-reveal>
							<span
								class="benefit__icon benefit__icon--d"
								aria-hidden="true"
							></span>
							<h3 class="benefit__title" data-i18n="benefit_control_title"></h3>
							<p class="benefit__text" data-i18n="benefit_control_text"></p>
						</li>
					</ul>
				</div>
			</section>

			<section
				class="section testimonials"
				id="testimonials"
				aria-labelledby="testimonials-title"
			>
				<div class="container">
					<header class="section__head section__head--row reveal" data-reveal>
						<div>
							<p class="section__kicker" data-i18n="testimonials_kicker"></p>
							<h2
								class="section__title"
								id="testimonials-title"
								data-i18n="testimonials_title"
							></h2>
						</div>
						<div class="testimonial__controls">
							<button
								type="button"
								class="icon-btn"
								data-testimonial-prev
								aria-label=""
								data-i18n-attr="aria-label|testimonial_prev_aria"
							></button>
							<button
								type="button"
								class="icon-btn icon-btn--next"
								data-testimonial-next
								aria-label=""
								data-i18n-attr="aria-label|testimonial_next_aria"
							></button>
						</div>
					</header>
					<div class="testimonial__viewport reveal" data-reveal>
						<div class="testimonial__track" data-testimonial-track></div>
						<div
							class="testimonial__dots"
							data-testimonial-dots
							role="tablist"
							aria-label=""
							data-i18n-attr="aria-label|testimonials_dots_aria"
						></div>
					</div>
				</div>
			</section>

			<section class="section join" id="join" aria-labelledby="join-title">
				<div class="container join__panel reveal" data-reveal>
					<div class="join__copy">
						<h2 class="join__title" id="join-title" data-i18n="join_title"></h2>
						<p class="join__text" data-i18n="join_text"></p>
					</div>
					<a class="btn btn--light" href="#contact" data-i18n="join_cta"></a>
				</div>
			</section>

			<section
				class="section contact"
				id="contact"
				aria-labelledby="contact-title"
			>
				<div id="contact-map" aria-hidden="true"></div>
				<div class="contact__overlay" aria-hidden="true"></div>
				<div class="container contact__grid">
					<div class="contact__intro reveal" data-reveal>
						<p class="section__kicker" data-i18n="contact_kicker"></p>
						<h2
							class="section__title"
							id="contact-title"
							data-i18n="contact_title"
						></h2>
						<p class="section__body" data-i18n="contact_intro"></p>
						<address class="contact__address">
							<p data-i18n="contact_address"></p>
							<p>
								<a
									class="contact__link"
									href="mailto:2332karolina@gmail.com"
									data-contact-email
								></a>
							</p>
							<p>
								<a
									class="contact__link"
									href="tel:+41765987128"
									data-contact-phone
								></a>
							</p>
						</address>
					</div>
					<div class="contact__actions reveal" data-reveal>
						<a
							class="btn btn--primary btn--block"
							href="https://wa.me/+41765987128"
							target="_blank"
							rel="noopener noreferrer"
							data-i18n="btn_whatsapp"
						></a>
						<a
							class="btn btn--outline btn--block"
							href="tg://resolve?domain=Karolina_Zahorulko"
							rel="noopener noreferrer"
							data-i18n="btn_telegram"
							onclick="
								setTimeout(() => {
									window.location.href = 'https://t.me/Karolina_Zahorulko';
								}, 500)
							"
						>
							Write in Telegram
						</a>
					</div>
				</div>
			</section>

					data-i18n="footer_back_top"
