		<script>
			(function () {
				function initMap() {
					var el = document.getElementById("contact-map");
					if (!el || typeof L === "undefined") return;
					// Replace lat/lng with real coordinates
					var lat = 47.3769,
						lng = 8.5417; // Zürich placeholder
					var map = L.map("contact-map", {
						center: [lat, lng],
						zoom: 14,
						zoomControl: false,
						scrollWheelZoom: false,
						dragging: false,
						touchZoom: false,
						doubleClickZoom: false,
						attributionControl: false,
						keyboard: false,
						boxZoom: false,
					});
					L.tileLayer(
						"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
						{ subdomains: "abcd", maxZoom: 19 },
					).addTo(map);
					L.circleMarker([lat, lng], {
						radius: 10,
						color: "#8b7355",
						fillColor: "#8b7355",
						fillOpacity: 1,
						weight: 3,
					}).addTo(map);
					// Force tile redraw after layout is complete
					setTimeout(function () {
						map.invalidateSize();
					}, 200);
				}
				if (document.readyState === "loading") {
					document.addEventListener("DOMContentLoaded", initMap);
				} else {
					initMap();
				}
			})();
		</script>
